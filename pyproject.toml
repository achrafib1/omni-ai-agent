[project]
name = "omni-ai-agent"
version = "0.1.0"
description = "Enterprise-grade Omnichannel AI Agent powered by LangGraph, FastMCP, and Supabase"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # API & Core
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    # AI & Agent Frameworks
    "langgraph>=0.1.5",
    "langchain>=0.2.6",
    "langchain-groq>=0.1.5",
    "langchain-google-genai>=1.0.6", # Google Gemini Integration
    # MCP & Tooling
    "fastmcp>=0.1.0",
    "mcp>=0.1.0",
    # Database, Memory & Migrations
    "supabase>=2.5.1",
    "sqlalchemy>=2.0.31",
    "alembic>=1.13.1", # Pro-level Database Migrations
    "langgraph-checkpoint-postgres>=1.0.0",
    # Observability & Logging
    "opik>=0.1.0",
    "rich>=13.7.1",
    # External APIs
    "httpx>=0.27.0",
    "elevenlabs>=1.5.0",
    "pgvector>=0.4.2",
    "asyncpg>=0.31.0",
    "psycopg2>=2.9.12",
    "psycopg[binary]>=3.3.4",
]

[dependency-groups]
dev = [
    "pytest>=8.2.2",
    "ruff>=0.5.0",
    "pre-commit>=3.7.1",
]

[tool.pyright]
extraPaths = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C90"]
ignore = ["E501"]
